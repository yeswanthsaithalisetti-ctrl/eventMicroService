spring.application.name=gateway.server.webmvc

server.port=9999

spring.cloud.gateway.server.webmvc.routes[0].id=event
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://event
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/event/**

spring.cloud.gateway.server.webmvc.routes[1].id=booking
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://booking
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/order/**

spring.cloud.gateway.server.webmvc.routes[2].id=payment
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://payment
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/payment/**

spring.cloud.gateway.server.webmvc.routes[3].id=user
spring.cloud.gateway.server.webmvc.routes[3].uri=lb://user
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/user/**

eureka.instance.prefer-ip-address=true

eureka.client.service-url.defaultZone=http://localhost:8888/eureka

logging.level.org.springframework.cloud.gateway=DEBUG
